<form class="search-form" [class.search-form--compact]="compact()" [class.search-form--inline]="inline()" [formGroup]="form" (ngSubmit)="submit()">
  <div class="search-form__row">
    <div class="form-field">
      <label class="form-label" for="departureCity">Ville de départ</label>
      <input
        id="departureCity"
        class="form-control"
        type="text"
        formControlName="departureCity"
        placeholder="Dakar"
        autocomplete="off"
        list="sn-cities"
      />
    </div>

    <div class="form-field">
      <label class="form-label" for="destinationCity">Destination</label>
      <input
        id="destinationCity"
        class="form-control"
        type="text"
        formControlName="destinationCity"
        placeholder="Thiès"
        autocomplete="off"
        list="sn-cities"
      />
    </div>

    <div class="form-field">
      <label class="form-label" for="departureDate">Date</label>
      <input
        id="departureDate"
        class="form-control"
        type="date"
        formControlName="departureDate"
        [attr.aria-invalid]="form.get('departureDate')?.invalid && form.get('departureDate')?.touched"
      />
      @if (form.get('departureDate')?.hasError('pastDate') && form.get('departureDate')?.touched) {
        <span class="form-error">La date ne peut pas être dans le passé.</span>
      }
    </div>
  </div>



  <button type="submit" class="btn btn--primary search-form__submit"><app-icon name="search" /> Rechercher</button>
</form>
<datalist id="sn-cities">
  @for (city of cities; track city) { <option [value]="city"></option> }
</datalist>
