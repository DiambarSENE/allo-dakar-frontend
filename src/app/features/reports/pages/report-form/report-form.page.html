<section class="container" style="padding-block: 2rem; max-width: 560px;">
  <h1>Signaler un problème</h1>
  @if (targetLabel) {
    <p class="form-hint">Vous signalez : <strong>{{ targetLabel }}</strong>.</p>
  } @else {
    <p class="form-hint">
      Aucune cible pré-remplie. Pour signaler un trajet, une réservation ou un avis précis,
      utilisez le bouton « Signaler » directement depuis sa page.
    </p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-field">
      <label class="form-label" for="reason">Motif</label>
      <select id="reason" class="form-control" formControlName="reason">
        @for (r of reasons; track r) {
          <option [value]="r">{{ reasonLabels[r] }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label class="form-label" for="description">Description (optionnel)</label>
      <textarea id="description" class="form-control" rows="4" formControlName="description"></textarea>
    </div>

    <div style="display:flex; gap: 0.75rem;">
      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Envoi…' : 'Envoyer le signalement' }}
      </button>
      <a class="btn btn--outline" routerLink="/reports">Annuler</a>
    </div>
  </form>
</section>
