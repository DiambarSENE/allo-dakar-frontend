server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular Router en mode history — toute route inconnue retombe sur index.html (le routing
    # côté client décide ensuite, y compris la page 404 applicative — voir app.routes.ts).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashés par le build Angular — cache long, sûr car le nom change à chaque build.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache (sinon un déploiement n'est pas vu par les
    # clients déjà ouverts).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ce conteneur ne sert QUE les fichiers statiques Angular — il ne doit jamais proxifier ou
    # exposer directement l'API Spring Boot ou Keycloak (§95 : ne pas exposer de ports backend
    # au public dans une architecture production). Le navigateur appelle l'API et Keycloak
    # directement via les URLs publiques configurées dans environment.production.ts.
}
